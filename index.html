<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EatMob</title>
<meta name="description" content="Match history, player ratings and stats for Eaters, an EA SPORTS FC Clubs team.">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#matches" aria-label="EatMob home"><img src="assets/logo.png" class="brand-mark" alt="" aria-hidden="true">EatMob</a>
    <nav class="nav" id="nav" aria-label="Sections">
      <a href="#matches" data-nav="matches">Matches</a>
      <a href="#stats" data-nav="stats">Stats</a>
      <a href="#squad" data-nav="squad">Squad</a>
      <a href="#compare" data-nav="compare">Compare</a>
    </nav>
    <div class="header-actions">
      <button class="theme-toggle" id="themeToggle" role="switch" aria-checked="false" aria-label="Toggle dark mode" title="Toggle dark mode"><span class="toggle-track"><span class="toggle-thumb"></span></span></button>
    </div>
  </div>
</header>
<main id="view" class="wrap"></main>
<div id="chart-tip" class="chart-tip" role="tooltip" hidden></div>
<footer class="foot wrap"></footer>
<script src="data/db.js"></script>
<script src="lib/normalize.js"></script>
<script src="app.js"></script>
</body>
</html>
