name: Update match data

on:
  schedule:
    # Runs at 17 and 47 minutes past every hour
    - cron: '17,47 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull latest changes
        run: git pull origin main --rebase || echo "No rebase needed"

      - name: Fetch latest data from EA
        run: node scripts/fetch.mjs

      - name: Commit and push if data changed
        run: |
          git add data/db.js
          git diff --staged --quiet || (git commit -m "chore: auto-update match data [skip ci]" && git push origin main)