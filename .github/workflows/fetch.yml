name: Fetch matches from EA

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub's shortest allowed interval; runs can start a few minutes late when GitHub is busy)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-matches
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull latest matches
        run: node scripts/fetch.mjs
      - name: Download club crests
        run: node scripts/fetch-crests.mjs
      - name: Commit new data
        run: |
          git config user.name "eatmob-bot"
          git config user.email "eatmob-bot@users.noreply.github.com"
          git add data/db.js crests/
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -m "Update match data and crests"
            git push
          fi
