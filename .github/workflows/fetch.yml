name: Fetch matches from EA

on:
  schedule:
    # Every 5 minutes is the most GitHub allows. It is a request, not a promise: GitHub
    # often starts scheduled runs late or skips them, so real gaps can be much longer.
    - cron: "17,47 * * * *"
  workflow_dispatch:

# Nothing is allowed by default; the one job below asks for the single permission it needs.
permissions: {}

concurrency:
  group: fetch-matches
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # commit data/db.js
    steps:
      # Pinned to an exact commit so a changed or hijacked tag cannot run new code with write access.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Pull latest matches
        run: node scripts/fetch.mjs
      - name: Commit new data
        run: |
          if git diff --quiet -- data/db.js; then
            echo "No new data."
            exit 0
          fi
          git config user.name "eatmob-bot"
          git config user.email "eatmob-bot@users.noreply.github.com"
          git add data/db.js
          git commit -m "Update match data"
          git pull --rebase origin main
          git push
